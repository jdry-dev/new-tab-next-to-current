<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 440px; height: 280px; overflow: hidden; }
  body { background: #1a73e8; color: #fff; font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
         display: flex; flex-direction: column; justify-content: center; padding: 0 34px; gap: 18px; }
  .top { display: flex; align-items: center; gap: 16px; }
  img { width: 64px; height: 64px; border-radius: 14px; box-shadow: 0 0 0 3px #fff, 0 4px 12px rgba(0,0,0,.25); }
  h1 { font-size: 30px; line-height: 1.1; font-weight: 700; }
  p { font-size: 18px; line-height: 1.35; opacity: .92; }
  kbd { font: inherit; font-weight: 600; background: rgba(255,255,255,.18); border-radius: 6px; padding: 0 6px; }
</style></head><body>
  <div class="top"><img src="../../icons/icon.svg" alt=""><h1>New Tab<br>Next To Current</h1></div>
  <p><kbd>Ctrl</kbd>+<kbd>T</kbd> opens the new tab right beside the one you're on, not at the end of the strip.</p>
</body></html>
